bundle:
  name: sandpit-agent-cicd
  databricks_cli_version: ">= 1.7.0, < 2.0.0"

include:
  - resources/*.yml
  - .generated/bundle/*.yml

sync:
  include:
    - .generated/agents/**
    - .generated/agent-index.json

variables:
  catalog:
    description: Unity Catalog catalog used by the demo.
    default: zacdav_sandpit_catalog
  schema:
    description: Unity Catalog schema used by the demo.
    default: dev_agent_cicd
  resource_prefix:
    description: Environment prefix used by target-specific workspace resources.
    default: dev
  warehouse_id:
    description: SQL warehouse used by tracing and Unity Catalog functions.
    default: f7a871ffa2a9ab80
  model_endpoint:
    description: Foundation Model API endpoint used by the agents.
    default: databricks-claude-sonnet-4-5
  experiment_id:
    description: ID returned by scripts/bootstrap_resources.py.
  trace_table_prefix:
    description: Prefix for the Unity Catalog OpenTelemetry trace tables.
    default: dev_sandpit_agent_cicd
  uc_function_name:
    description: Unity Catalog cost function exposed through managed MCP.
    default: dev_estimate_project_cost
  uc_time_function_name:
    description: Unity Catalog time function exposed through managed MCP.
    default: dev_current_utc_timestamp

scripts:
  register_uc_agent:
    content: >-
      $PYTHON_BIN scripts/register_uc_agent.py
      --target $DATABRICKS_BUNDLE_TARGET
  smoke_test:
    content: >-
      $PYTHON_BIN scripts/smoke_test.py
      --target $DATABRICKS_BUNDLE_TARGET

targets:
  dev:
    default: true
    mode: development
    variables:
      resource_prefix: dev
      schema: dev_agent_cicd
      trace_table_prefix: dev_sandpit_agent_cicd
      uc_function_name: dev_estimate_project_cost
      uc_time_function_name: dev_current_utc_timestamp
    workspace:
      host: https://fevm-zacdav-sandpit.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    variables:
      resource_prefix: prod
      schema: prod_agent_cicd
      trace_table_prefix: prod_sandpit_agent_cicd
      uc_function_name: prod_estimate_project_cost
      uc_time_function_name: prod_current_utc_timestamp
    workspace:
      host: https://fevm-zacdav-sandpit.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
