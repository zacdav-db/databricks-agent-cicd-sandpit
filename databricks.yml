bundle:
  name: sandpit-agent-cicd
  databricks_cli_version: ">= 1.7.0, < 2.0.0"

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog used by the demo.
    default: zacdav_sandpit_catalog
  schema:
    description: Unity Catalog schema used by the demo.
    default: default
  warehouse_id:
    description: SQL warehouse used by tracing and Unity Catalog functions.
    default: f7a871ffa2a9ab80
  model_endpoint:
    description: Foundation Model API endpoint used by the agents.
    default: databricks-claude-sonnet-4-5
  experiment_id:
    description: ID returned by scripts/bootstrap_resources.py.
  trace_table_prefix:
    description: Prefix for the Unity Catalog OpenTelemetry trace tables.
    default: sandpit_agent_cicd
  uc_function_name:
    description: Unity Catalog cost function exposed through managed MCP.
    default: estimate_project_cost
  uc_time_function_name:
    description: Unity Catalog time function exposed through managed MCP.
    default: current_utc_timestamp

scripts:
  register_uc_agent:
    content: >-
      $PYTHON_BIN scripts/register_uc_agent.py
      --target $DATABRICKS_BUNDLE_TARGET
      --catalog zacdav_sandpit_catalog
      --schema default
  smoke_test:
    content: >-
      $PYTHON_BIN scripts/smoke_test.py
      --target $DATABRICKS_BUNDLE_TARGET

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://fevm-zacdav-sandpit.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      host: https://fevm-zacdav-sandpit.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
