bundle:
  name: sandpit-mcp-tools
  databricks_cli_version: ">= 1.7.0, < 2.0.0"

variables:
  resource_prefix: {}

targets:
  dev:
    default: true
    mode: development
    variables:
      resource_prefix: dev
    workspace:
      host: https://fevm-zacdav-sandpit.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  prod:
    mode: production
    variables:
      resource_prefix: prod
    workspace:
      host: https://fevm-zacdav-sandpit.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

resources:
  apps:
    mcp_server:
      name: mcp-${var.resource_prefix}-sandpit-tools
      description: Custom Streamable HTTP MCP server deployed by a Databricks Asset Bundle.
      source_code_path: .
      config:
        command: [python, server.py]
      permissions:
        - level: CAN_USE
          group_name: users
