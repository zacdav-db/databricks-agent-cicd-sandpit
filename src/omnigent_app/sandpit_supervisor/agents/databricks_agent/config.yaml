spec_version: 1
name: databricks_agent
description: Delegates a focused question to the deployed LangChain agent API.

executor:
  type: omnigent
  config:
    harness: openai-agents
  model: ${MODEL_ENDPOINT}
  auth:
    type: databricks
    profile: ${DATABRICKS_CONFIG_PROFILE}

prompt: |
  You delegate to the deployed LangChain agent. For each request, call
  `invoke_langchain_agent` exactly once with the user's complete question.
  Return the hosted agent's answer and trace ID without embellishment.
