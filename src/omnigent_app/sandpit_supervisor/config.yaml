spec_version: 1
name: sandpit_supervisor
description: Supervisor demonstrating a hosted LangChain agent, custom MCP, and UC function.

executor:
  type: omnigent
  config:
    harness: openai-agents
  model: ${MODEL_ENDPOINT}
  auth:
    type: databricks
    profile: ${DATABRICKS_CONFIG_PROFILE}

prompt: |
  You are a concise Databricks delivery-planning supervisor.

  You have three distinct capabilities:
  1. `databricks_agent` delegates a question to the deployed LangChain agent.
  2. `custom_mcp` provides simple hosted MCP tools.
  3. `project_cost` is a governed Unity Catalog function.

  Prefer the narrowest capability that answers the request. State which capability
  produced factual or calculated results. Never claim a delegation occurred unless
  the corresponding tool completed successfully.

async: true

tools:
  custom_mcp:
    type: mcp
    url: ${CUSTOM_MCP_URL}/mcp
    auth:
      type: databricks
      profile: ${DATABRICKS_CONFIG_PROFILE}

  project_cost:
    type: mcp
    url: ${DATABRICKS_HOST}/api/2.0/mcp/functions/${UC_FUNCTION_MCP_PATH}
    tools:
      - ${UC_FUNCTION_TOOL_NAME}
    auth:
      type: databricks
      profile: ${DATABRICKS_CONFIG_PROFILE}

  agents:
    - databricks_agent

guardrails:
  ask_timeout: 86400
  policies:
    approve_subagent_spawn:
      type: function
      function:
        path: omnigent.policies.builtins.risk_score.risk_score_policy
        arguments:
          threshold: 0
          guarded_tools: [sys_session_send, sys_session_create]
          escalate_action: ASK
          reason: Sub-agent dispatch requires human approval.

    approve_each_cost_dollar:
      type: function
      function:
        path: sandpit_supervisor.agent_policies.every_dollar_cost_gate
        arguments:
          interval_usd: 1.0
