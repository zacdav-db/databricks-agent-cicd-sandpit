bundle:
  name: sandpit-omnigent
  databricks_cli_version: ">= 1.7.0, < 2.0.0"

variables:
  resource_prefix: {}
  model_endpoint:
    default: databricks-claude-sonnet-4-5
  langchain_agent_app_name: {}

targets:
  dev:
    default: true
    mode: development
    variables:
      resource_prefix: dev
      langchain_agent_app_name: dev-sandpit-langchain-agent
    workspace:
      host: https://fevm-zacdav-sandpit.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  prod:
    mode: production
    variables:
      resource_prefix: prod
      langchain_agent_app_name: prod-sandpit-langchain-agent
    workspace:
      host: https://fevm-zacdav-sandpit.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

resources:
  apps:
    omnigent:
      name: ${var.resource_prefix}-sandpit-omnigent
      description: Omnigent server with a pre-registered YAML supervisor agent.
      source_code_path: .
      config:
        command: [python, launch.py]
        env:
          - name: MODEL_ENDPOINT
            value_from: llm
          - name: LANGCHAIN_AGENT_APP_NAME
            value_from: langchain_agent_app
      resources:
        - name: llm
          serving_endpoint:
            name: ${var.model_endpoint}
            permission: CAN_QUERY
        - name: langchain_agent_app
          app:
            name: ${var.langchain_agent_app_name}
            permission: CAN_USE
      permissions:
        - level: CAN_USE
          user_name: zachary.davies@databricks.com
