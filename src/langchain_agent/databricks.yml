bundle:
  name: sandpit-langchain-agent
  databricks_cli_version: ">= 1.7.0, < 2.0.0"

variables:
  catalog:
    default: zacdav_sandpit_catalog
  schema: {}
  resource_prefix: {}
  warehouse_id:
    default: f7a871ffa2a9ab80
  model_endpoint:
    default: databricks-claude-sonnet-4-5
  experiment_id: {}
  trace_table_prefix: {}
  uc_function_name: {}
  uc_time_function_name: {}
  custom_mcp_app_name: {}

targets:
  dev:
    default: true
    mode: development
    variables:
      resource_prefix: dev
      schema: dev_agent_cicd
      trace_table_prefix: dev_sandpit_agent_cicd
      uc_function_name: dev_estimate_project_cost
      uc_time_function_name: dev_current_utc_timestamp
      custom_mcp_app_name: mcp-dev-sandpit-tools
    workspace:
      host: https://fevm-zacdav-sandpit.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  prod:
    mode: production
    variables:
      resource_prefix: prod
      schema: prod_agent_cicd
      trace_table_prefix: prod_sandpit_agent_cicd
      uc_function_name: prod_estimate_project_cost
      uc_time_function_name: prod_current_utc_timestamp
      custom_mcp_app_name: mcp-prod-sandpit-tools
    workspace:
      host: https://fevm-zacdav-sandpit.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

resources:
  apps:
    langchain_agent:
      name: agent-${var.resource_prefix}-sandpit-langchain
      description: LangChain tool-calling agent with MLflow traces stored in Unity Catalog.
      source_code_path: .
      config:
        command: [uvicorn, "app:app", --host, 0.0.0.0, --port, "8000"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: databricks
          - name: MLFLOW_EXPERIMENT_ID
            value_from: trace_experiment
          - name: MLFLOW_TRACING_SQL_WAREHOUSE_ID
            value_from: trace_warehouse
          - name: MODEL_ENDPOINT
            value_from: llm
          - name: CUSTOM_MCP_APP_NAME
            value_from: custom_mcp_app
          - name: DEPLOYMENT_ENV
            value: ${bundle.target}
          - name: UC_COST_FUNCTION_FULL_NAME
            value_from: project_cost_function
          - name: UC_TIME_FUNCTION_FULL_NAME
            value_from: current_time_function
      resources:
        - name: llm
          serving_endpoint:
            name: ${var.model_endpoint}
            permission: CAN_QUERY
        - name: custom_mcp_app
          app:
            name: ${var.custom_mcp_app_name}
            permission: CAN_USE
        - name: trace_experiment
          experiment:
            experiment_id: ${var.experiment_id}
            permission: CAN_EDIT
        - name: trace_warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: trace_annotations_select
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.${var.trace_table_prefix}_otel_annotations
            securable_type: TABLE
            permission: SELECT
        - name: trace_annotations_modify
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.${var.trace_table_prefix}_otel_annotations
            securable_type: TABLE
            permission: MODIFY
        - name: trace_logs_select
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.${var.trace_table_prefix}_otel_logs
            securable_type: TABLE
            permission: SELECT
        - name: trace_logs_modify
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.${var.trace_table_prefix}_otel_logs
            securable_type: TABLE
            permission: MODIFY
        - name: trace_metrics_select
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.${var.trace_table_prefix}_otel_metrics
            securable_type: TABLE
            permission: SELECT
        - name: trace_metrics_modify
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.${var.trace_table_prefix}_otel_metrics
            securable_type: TABLE
            permission: MODIFY
        - name: trace_spans_select
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.${var.trace_table_prefix}_otel_spans
            securable_type: TABLE
            permission: SELECT
        - name: trace_spans_modify
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.${var.trace_table_prefix}_otel_spans
            securable_type: TABLE
            permission: MODIFY
        - name: project_cost_function
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.${var.uc_function_name}
            securable_type: FUNCTION
            permission: EXECUTE
        - name: current_time_function
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.${var.uc_time_function_name}
            securable_type: FUNCTION
            permission: EXECUTE
      permissions:
        - level: CAN_USE
          group_name: users
