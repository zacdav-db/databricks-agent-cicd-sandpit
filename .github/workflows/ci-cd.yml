name: Test and deploy

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sandpit-agent-cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-deployments:
    name: Select changed deployment units
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.select.outputs.deployable }}
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Map changed paths to isolated deployment units
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          selection="$(
            python scripts/select_deployments.py \
              --base "${BASE_SHA}" \
              --head "${HEAD_SHA}"
          )"
          echo "selection=${selection}" >> "${GITHUB_OUTPUT}"
          if [[ "$(jq -r '.apps + .agents | length' <<<"${selection}")" -gt 0 ]]; then
            echo "deployable=true" >> "${GITHUB_OUTPUT}"
          else
            echo "deployable=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "Selected deployments: \`${selection}\`" >> "${GITHUB_STEP_SUMMARY}"

  promotion-source:
    name: Promotion source is repository dev
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require an internal dev to main promotion
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "${BASE_BRANCH}" = "main"
          test "${HEAD_BRANCH}" = "dev"
          test "${HEAD_REPOSITORY}" = "${REPOSITORY}"

  production-promotion:
    name: Production commit came from dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify the commit is associated with a merged dev promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          promotion_count="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '[.[] | select(
                .merged_at != null and
                .base.ref == "main" and
                .head.ref == "dev" and
                .head.repo.full_name == .base.repo.full_name
              )] | length'
          )"
          test "${promotion_count}" -gt 0

  test:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Block implicit agent deletion or rename
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "${BASE_SHA}" "${HEAD_SHA}"
          deleted="$(
            git diff --diff-filter=D --name-only \
              "${BASE_SHA}" "${HEAD_SHA}" -- 'agents/*/agent.yaml'
          )"
          if [[ -n "${deleted}" ]]; then
            echo "Agent deletion/rename needs an explicit retirement workflow:" >&2
            echo "${deleted}" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: |
            requirements*.txt
            agent_platform/requirements.txt
            agents/**/requirements.txt
            examples/**/requirements.txt
            examples/**/platform-requirements.txt
            src/**/requirements.txt
      - name: Install test dependencies
        run: |
          uv pip install --system \
            -r requirements-ci.txt \
            -r src/langchain_agent/requirements.txt \
            -r src/mcp_server/requirements.txt
      - name: Compose folder-defined agents
        run: python scripts/compose_agents.py
      - name: Resolve App dependencies for Linux and Python 3.11
        run: python scripts/validate_agent_dependencies.py
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Validate Omnigent YAML
        run: python scripts/validate_omnigent.py
      - name: Select the Databricks Apps Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Compile generated Apps with Python 3.11
        run: python -m compileall -q .generated/bundles
      - name: Validate the pinned tracing integrations
        run: |
          uv venv --python python .tracing-test-venv
          uv pip install --python .tracing-test-venv/bin/python \
            -r agent_platform/requirements.txt \
            -r agents/claude-assistant/requirements.txt \
            -r agents/gemini-assistant/requirements.txt \
            -r agents/langchain-assistant/requirements.txt \
            -r agents/openai-assistant/requirements.txt
          PYTHONPATH="agent_platform" \
            .tracing-test-venv/bin/python -c \
              "from _platform_tracing import configure_autologging; assert configure_autologging() == ('langchain', 'openai', 'anthropic', 'google.genai')"
      - name: Validate the external agent bootstrap
        run: |
          uv venv --python python .external-test-venv
          uv pip install --python .external-test-venv/bin/python \
            -r examples/external-agent/platform-requirements.txt \
            -r examples/external-agent/requirements.txt
          PYTHONPATH="agent_platform:examples/external-agent/platform_bootstrap:examples/external-agent" \
            .external-test-venv/bin/python -c \
              "import author_agent; from _platform_tracing import configure_autologging; assert configure_autologging() == ('openai',)"

  package-deployment:
    name: Package deployment dependencies
    if: >-
      github.event_name == 'push' &&
      needs.select-deployments.outputs.deployable == 'true'
    needs: [select-deployments, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheelhouse for the authorized deployment runner
        run: >-
          python -m pip download
          --dest deploy-wheelhouse
          --only-binary=:all:
          --platform macosx_12_0_arm64
          --python-version 3.12
          --implementation cp
          --abi cp312
          --abi abi3
          --abi none
          -r requirements-deploy.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-wheelhouse
          path: deploy-wheelhouse
          retention-days: 1

  deploy-dev:
    name: Deploy development
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      needs.select-deployments.outputs.deployable == 'true'
    needs: [select-deployments, test, package-deployment]
    # The workspace IP ACL rejects ephemeral GitHub-hosted addresses.
    runs-on: [self-hosted, macOS, ARM64, sandpit-deploy]
    environment: production
    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: databricks/setup-cli@8b7b124dc4f5b9621e959ea61cf4d3dd4e421f67
        with:
          version: 1.10.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-wheelhouse
          path: deploy-wheelhouse
      - name: Install deployment dependencies
        run: |
          uv venv --python python3.12 .deploy-venv
          uv pip install --python .deploy-venv/bin/python \
            --no-index \
            --find-links deploy-wheelhouse \
            -r requirements-deploy.txt
      - name: Deploy and verify development
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PYTHON_BIN: .deploy-venv/bin/python
        run: scripts/deploy_target.sh dev "${BASE_SHA}" "${HEAD_SHA}"

  deploy-prod:
    name: Deploy production
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.select-deployments.outputs.deployable == 'true'
    needs:
      - select-deployments
      - test
      - package-deployment
      - production-promotion
    runs-on: [self-hosted, macOS, ARM64, sandpit-deploy]
    environment: production
    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: databricks/setup-cli@8b7b124dc4f5b9621e959ea61cf4d3dd4e421f67
        with:
          version: 1.10.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-wheelhouse
          path: deploy-wheelhouse
      - name: Install deployment dependencies
        run: |
          uv venv --python python3.12 .deploy-venv
          uv pip install --python .deploy-venv/bin/python \
            --no-index \
            --find-links deploy-wheelhouse \
            -r requirements-deploy.txt
      - name: Deploy and verify production
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PYTHON_BIN: .deploy-venv/bin/python
        run: scripts/deploy_target.sh prod "${BASE_SHA}" "${HEAD_SHA}"
