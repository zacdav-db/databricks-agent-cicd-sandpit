name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandpit-agent-cicd
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: |
            requirements*.txt
            src/**/requirements.txt
      - name: Install test dependencies
        run: |
          uv pip install --system \
            -r requirements-ci.txt \
            -r src/langchain_agent/requirements.txt \
            -r src/mcp_server/requirements.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Validate Omnigent YAML
        run: python scripts/validate_omnigent.py
      - name: Build macOS deploy wheelhouse
        run: >-
          python -m pip download
          --dest deploy-wheelhouse
          --only-binary=:all:
          --platform macosx_11_0_arm64
          --python-version 3.12
          --implementation cp
          --abi cp312
          --abi abi3
          --abi none
          -r requirements-deploy.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-wheelhouse
          path: deploy-wheelhouse
          retention-days: 1

  deploy-dev:
    if: github.event_name != 'pull_request'
    needs: test
    name: Deploy development
    # The sandpit workspace IP ACL rejects ephemeral GitHub-hosted addresses.
    # This runner is repository-scoped and uses an already-authorized network.
    runs-on: [self-hosted, macOS, ARM64, sandpit-deploy]
    environment: production
    outputs:
      experiment_id: ${{ steps.bootstrap.outputs.experiment_id }}
    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: databricks/setup-cli@8b7b124dc4f5b9621e959ea61cf4d3dd4e421f67
        with:
          version: 1.7.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements-deploy.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-wheelhouse
          path: deploy-wheelhouse
      - name: Install deployment dependencies
        run: |
          uv venv --python python3.12 .deploy-venv
          uv pip install --python .deploy-venv/bin/python \
            --no-index \
            --find-links deploy-wheelhouse \
            -r requirements-deploy.txt
      - name: Bootstrap trace tables and UC functions
        id: bootstrap
        run: >-
          .deploy-venv/bin/python scripts/bootstrap_resources.py
          --github-output "$GITHUB_OUTPUT"
      - name: Deploy and verify development
        env:
          PYTHON_BIN: .deploy-venv/bin/python
        run: >-
          scripts/deploy_target.sh dev
          ${{ steps.bootstrap.outputs.experiment_id }}

  deploy-prod:
    if: github.event_name != 'pull_request'
    needs: [test, deploy-dev]
    name: Promote to production
    runs-on: [self-hosted, macOS, ARM64, sandpit-deploy]
    environment: production
    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: databricks/setup-cli@8b7b124dc4f5b9621e959ea61cf4d3dd4e421f67
        with:
          version: 1.7.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements-deploy.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-wheelhouse
          path: deploy-wheelhouse
      - name: Install deployment dependencies
        run: |
          uv venv --python python3.12 .deploy-venv
          uv pip install --python .deploy-venv/bin/python \
            --no-index \
            --find-links deploy-wheelhouse \
            -r requirements-deploy.txt
      - name: Deploy and verify production
        env:
          PYTHON_BIN: .deploy-venv/bin/python
        run: >-
          scripts/deploy_target.sh prod
          ${{ needs.deploy-dev.outputs.experiment_id }}
